# Wird in jeder location eingebunden (nginx erbt add_header nicht, sobald eine location eigene setzt).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

# Content-Security-Policy: alles vom eigenen Ursprung, keine externen Dienste.
# Besonderheiten der App:
#  - 'wasm-unsafe-eval' + worker-src blob:  -> der Draco-Decoder (3D-Modell) läuft als
#    Blob-Worker mit WebAssembly.
#  - style-src 'unsafe-inline'              -> Angular spielt Komponenten-Styles inline ein.
#  - img-src data: blob:                    -> Texturen und Canvas-Inhalte des 3D-Viewers.
#  - connect-src 'self'                     -> nur die eigene API (/api) und eigene Assets.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'" always;
